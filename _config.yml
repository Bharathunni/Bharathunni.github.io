# ------------------------------------------------------------------
# SITE SETTINGS: edit the values in quotes. Nothing else needs touching.
# ------------------------------------------------------------------

name: "Bharath R Unni"
credential: "Chartered Accountant"

# Your one-line positioning statement (shown under your name on the home page).
positioning: "AI in Finance | Assurance | FP&A"

# Lines that rotate under your name on the home page, one every few seconds.
taglines:
  - "Chartered Accountant"
  - "AI in Finance"
  - "Assurance"
  - "FP&A"
  - "I build the tools finance teams wish they had"

# The short "About" paragraph on the home page.
about: "Chartered Accountant working where assurance, FP&A and AI meet. I write frameworks that put a cash number on operating decisions, and I ship working systems that take the manual grind out of a finance function."

# Tools that appear in your builds. Shown as chips under "About".
stack:
  - "Python"
  - "React"
  - "Vite"
  - "Capacitor"
  - "GitHub Actions"
  - "Google Sheets"
  - "pytest"

# Overview details on the home page. Leave a value as "" to hide it.
location: "India"
timezone: "Asia/Kolkata"

# Optional photo for the round avatar, e.g. "/assets/img/me.jpg". Leave "" to show your initial.
avatar: ""

# Contact details shown on the home page and in the footer. Leave a value as "" to hide it.
email: "bharath.r.unni@gmail.com"
linkedin: "https://www.linkedin.com/in/bharathunni"
github: "https://github.com/bharathunni"

# Short description used by Google and by link previews on LinkedIn/WhatsApp.
description: "Analytical finance frameworks by Bharath R Unni, Chartered Accountant."

# ------------------------------------------------------------------
# TECHNICAL SETTINGS: no need to change anything below this line.
# ------------------------------------------------------------------

title: "Bharath R Unni"
url: "https://bharathunni.github.io"
baseurl: ""
future: true

markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  hard_wrap: false
  syntax_highlighter_opts:
    disable: true

collections:
  frameworks:
    output: true
    permalink: /frameworks/:name/
  builds:
    output: true
    permalink: /builds/:name/

defaults:
  - scope:
      path: ""
      type: frameworks
    values:
      layout: article
  - scope:
      path: ""
      type: builds
    values:
      layout: article

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - templates
